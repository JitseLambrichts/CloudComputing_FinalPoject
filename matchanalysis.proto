syntax = "proto3";

package be.cloud;
option php_namespace = "App\\Models";
option php_metadata_namespace = "App\\Models\\GPBMetadata";

message LivePlayerUpdate {
    string playerName = 1;
    int32 currentHeartRate = 2;
    float currentLactate = 3;
    int64 timestamp = 4;
}

message AnalysisResponse {
    string recommendation = 1;
    bool shouldSubstitute = 2;
    int32 fatigueLevel = 3;   // Hoe moe een speler is op een schaal van 10
    float avgHeartRate = 4;
    float avgLactate = 5;
    int32 totalMessages = 6;
    bool isFinalSummary = 7;
}

service AnalyticsService {
    // Stream zorgt voor Bidirectional Streaming --> uitbreiding
    rpc StreamPlayerAnalytics(stream LivePlayerUpdate) returns (stream AnalysisResponse); 
}