<!-- Bronvermelding: Chart.js -->

<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<!-- Voeg flex-wrap toe en verwijder min-width: 900px. Voeg box-sizing toe voor padding. -->
<body style="margin:0; padding:10px; width: 100%; box-sizing: border-box; min-height:100vh; display:flex; flex-wrap: wrap; justify-content:center; align-items:center; gap: 20px;">
    <!-- Voeg max-width: 100% toe zodat ze niet breder zijn dan het scherm -->
    <div style="width: 600px; max-width: 100%; height: 100%;">
        <canvas id="heartBeatChart"></canvas>
    </div>
    <div style="width: 600px; max-width: 100%; height: 100%;">
        <canvas id="lactateChart"></canvas>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
